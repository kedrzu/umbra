name: umbra

services:
  # ==========================
  # Gmail MCP Server
  # ==========================
  gmail:
    build:
      context: ./mcp-servers/gmail
      dockerfile: Dockerfile
    container_name: umbra-gmail
    restart: unless-stopped
    networks:
      - mcp-network
    ports:
      - "${MCP_GMAIL_PORT:-4002}:4002"
    volumes:
      - type: bind
        source: ${GMAIL_CREDENTIALS_PATH}
        target: /config/credentials.json
        read_only: true
      - gmail-tokens:/config/tokens
      - type: bind
        source: ./.context/attachments
        target: /attachments
    environment:
      - GMAIL_CREDENTIALS_PATH=/config/credentials.json
      - GMAIL_TOKENS_PATH=/config/tokens
      - GMAIL_ATTACHMENTS_DIR=/attachments
      - GMAIL_ATTACHMENTS_RETURN_BASE=.context/attachments
      - MCP_PORT=4002
      - MCP_TRANSPORT=http
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================
  # Google Calendar MCP Server
  # ==========================
  # UWAGA: klienci MCP łączą się z tym serwerem przez **stdio**
  # (`docker exec -i -e TRANSPORT=stdio umbra-calendar node build/index.js`, patrz .mcp.json),
  # a nie przez HTTP. Transport HTTP w @cocal/google-calendar-mcp 2.6.2 obsługuje tylko
  # PIERWSZY request w cyklu życia procesu - kolejne zwracają puste HTTP 500 (regresja
  # z @modelcontextprotocol/sdk 1.27.1, gdzie StreamableHTTPServerTransport to wrapper
  # na @hono/node-server). Port 4003 zostaje wystawiony dla webowego UI zarządzania
  # kontami Google (http://localhost:4003/) i healthchecku.
  calendar:
    build:
      context: ./mcp-servers/calendar
      dockerfile: Dockerfile
    container_name: umbra-calendar
    restart: unless-stopped
    networks:
      - mcp-network
    ports:
      - "${MCP_CALENDAR_PORT:-4003}:4003"
    volumes:
      - type: bind
        source: ${CALENDAR_CREDENTIALS_PATH}
        target: /config/gcp-oauth.keys.json
        read_only: true
      - ${CALENDAR_TOKENS_PATH:-~/.config/google-calendar-mcp}:/config/tokens
    environment:
      - GOOGLE_OAUTH_CREDENTIALS=/config/gcp-oauth.keys.json
      - GOOGLE_CALENDAR_MCP_TOKEN_PATH=/config/tokens/tokens.json
      - ENABLED_TOOLS=list-calendars,list-events,get-event,search-events,list-colors,get-freebusy,get-current-time,create-event,manage-accounts
      - TRANSPORT=http
      - HOST=0.0.0.0
      - PORT=4003
    healthcheck:
      disable: true

networks:
  mcp-network:
    driver: bridge
    name: umbra-mcp-network

volumes:
  gmail-tokens:
    name: umbra-gmail-tokens
  calendar-tokens:
    name: umbra-calendar-tokens
